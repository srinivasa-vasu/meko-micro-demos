spring:
  application:
    name: meko-console
  jackson:
    serialization:
      indent-output: true

server:
  port: ${PORT:8090}

meko:
  # The connection is the shared meko-client: the key, the server, and how this console names itself.
  enabled: ${MEKO_ENABLED:true}
  api-key: ${MEKO_API_KEY:}
  mcp-url: ${MEKO_MCP_URL:https://mcp.mekodata.ai/mcp}
  client-name: ${spring.application.name}
  conversation-owner: ${MEKO_AGENT_ID:meko-console}
  # Namespaces what this console writes, and seeds the conversation dedup key.
  agent-id: ${MEKO_AGENT_ID:meko-console}

logging:
  level:
    meko.console: INFO
