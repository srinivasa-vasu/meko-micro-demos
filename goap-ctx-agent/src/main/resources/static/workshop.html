function pairGuide(run, check, body) {
  const name = esc(status.store.datapack || 'your datapack');
  if (step === 0) return [PAIR_TITLES[pair.role][0], pair.role === 'eu'
    ? ['Create the datapack you will share. Your agent writes and promotes its lesson here.'] : ['Create a datapack of your own: your baseline runs here, with nothing anyone else learned in reach.'], body[2]];
  if (step === 5) return [PAIR_TITLES.eu[5], ['You are the EU payments desk: your agent, in your desk\'s application, gets case 1 of the failed payment. It investigates, then promotes the root cause from memory to collective memory in your datapack.',
    'Under Shared knowledge, what did it promote? Your partner runs their baseline meanwhile.'], run];
  if (step === 7) return [PAIR_TITLES.eu[7], ['In the Meko app, share <b>' + name + '</b> with your partner\'s account. Reading is enough: they promote nothing.',
    'Then press <b>I\'ve shared it</b> and tell your partner the datapack\'s name.'],
    '<button class="btn primary" data-act="shared"' + (busy || pair.shared ? ' disabled' : '') + '>' + icon(pair.shared ? 'check' : 'user') + (pair.shared ? 'Shared' : 'I\'ve shared it') + '</button>'];
  if (step === 1) return [PAIR_TITLES.apac[1], ['In your own datapack, still empty: a failed payment reaches the APAC desk\'s payments investigator. Nothing anyone else learned is in reach.',
    'How many hypotheses does it test? Your partner is solving case 1 meanwhile. What it finds is not promoted.'], run];
  if (step === 8) return [PAIR_TITLES.apac[8], ['When your partner has shared their datapack, pick it below: it shows as shared with you. Press <b>Refresh</b> if it is not listed yet.',
    'Your baseline stays on this page.'], datapackForm(true)];
  if (step === 6) return [PAIR_TITLES.apac[6], ['The same case as your baseline, now in your partner\'s datapack. Does your investigator still test every hypothesis?',
    lesson ? 'In reach: the lesson promoted by <b>' + esc(lesson.writtenBy) + '</b>.' : 'Your partner\'s lesson is not in this datapack yet.'], run + check];
  return body;
}

/** The steps go in order: the first earlier step this use case needs that is not done yet, as the reason to wait, or null. */
function earlierOpen(i) {
  const mine = mySteps();
  const open = mine.slice(0, Math.max(0, mine.indexOf(i))).find(j => !stepDone(j));
  return open == null ? null : 'Finish step ' + stepNo(open) + ' first: ' + stepTitle(open) + '.';
}

/** What the learning use case's first two runs ask (its last one is the finale). */
const LEARN_GUIDE = {
  1: ['A failed payment reaches the APAC payments desk\'s investigator. Nothing has been promoted yet: each run of this step starts a new learning epoch, so lessons from earlier runs are set aside.',
      'How many hypotheses does it test before it finds the root cause? This is the baseline: what it finds is not promoted, so the only lesson later is the one the EU desk promotes.'],
  5: ['Case 1 reaches the EU payments desk: another desk\'s agent, in its own application. It investigates the same failure, then promotes the root cause from memory to collective memory.',
      'Under Shared knowledge, what was promoted, and by whom?']};

/**
 * Why a stage cannot run now, or null if it can: a stage only means what it says while the datapack holds exactly that
 * stage's context for this use case. An earlier stage cannot be reproduced once later context is in the datapack.
 */
function stageBlocked(s) {
  // The learning use case: its last run reads what the EU desk's case 1 promoted, in that run's learning epoch.
  if (pairOn()) return s === 3 && !lesson ? 'Waiting for your partner\'s lesson: once they have run case 1 and shared their datapack, press Check my datapack.' : null;
  if (selected === LEARNS) return s === 3 && !(runs[LEARNS] && runs[LEARNS][2] && runs[LEARNS][2].epoch)
    ? 'Run step ' + stepNo(5) + ' first: the EU desk solves case 1.' : null;
  const u = status.useCases.find(x => x.id === selected);
  const docsIn = u.documents.length > 0 && u.documents.every(k => docIn(status.documents[k]));
  const histIn = u.history && status.history[selected] === 'seeded';
  const rerun = ' This stage cannot be reproduced in it: start over with a new datapack to run it.';
  if (s === 0 && docsIn) return 'Your datapack already has the documents.' + rerun;
  if (s === 0 && histIn) return 'Your datapack already has last quarter\'s reviews.' + rerun;
  if (s === 1 && !docsIn) return 'Add the documents first (step ' + stepNo(2) + ').';
  if (s === 1 && histIn) return 'Your datapack already has last quarter\'s reviews.' + rerun;
  if (s === 2 && !histIn) return 'Add last quarter\'s reviews first (step ' + stepNo(4) + ').';
  if (s === 2 && memoryFirst() && !docsIn) return 'Add the documents first (step ' + stepNo(2) + ').';
  return null;
}

/** Step 7 for the selected use case: run it again where something was promoted, then audit it where it has an auditor. */
function finale() {
  const c = catalog[selected];
  const rerun = promotes(selected);
  const audit = !!c.followUp;
  const lines = [];
  if (selected === LEARNS) lines.push('The same case as step ' + stepNo(1) + ', for the APAC desk\'s investigator again: the root cause the EU desk promoted in case 1 is now collective memory. Does it still test every hypothesis?',
    'Compare with the <i>Without the lesson</i> card: the same case, the same agent; only the context changed.');
  if (selected === 'loan-underwriting') lines.push('Run it once more: the credit-risk ruling promoted in an earlier run is now collective memory. Does anyone ask credit risk this time?');
  if (audit) lines.push((rerun ? 'Then an' : 'An') + ' auditor, given only the ' + esc(c.followUp.subject) + ' id, reads the whole record back. How many records did it have to request?');
  if (audit && !rerun && !lastMekoRun()) lines.push('Run this use case at an earlier step first: there is nothing to audit yet.');
  return {rerun, audit, lines, label: rerun && audit ? 'Run, then audit' : audit ? 'Audit' : 'Run'};
}
const lastMekoRun = () => Object.keys(runs[selected] || {}).length > 0;

function datapackLines() {
  const s = status.store;
  if (!s.keyed) return ['No Meko API key: set <code>MEKO_API_KEY</code> and restart with <code>SPRING_PROFILES_ACTIVE=workshop</code>. Until then this session uses the offline stand-in: every step works, but nothing is kept after a restart.'];
  const lines = ['Your datapack is where memory, shared knowledge and collective memory live. Start from a new, empty one, so the first stage really has no context.'];
  // Choosing a new one (Start over): the one left behind is named above the choice, not as the one in use.
  if (s.live && s.connected && !choosing) lines.push('In use: <b>' + esc(s.datapack) + '</b>.');
  else if (s.error) lines.push('<b>' + esc(s.error) + '</b>');
  return lines;
}

/** A fresh, unique name for a new datapack (Meko names are unique across the platform); kept only for this page. */
let suggested = null;
/** Set by Start over: the step shows the form again, though a datapack is still in use until another is chosen. */
let choosing = false;
function suggestedName() {
  if (!suggested) {
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const stem = () => 'meko-workshop-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + Math.random().toString(36).slice(2, 6);
    // Per use case: one stem for the participant's datapacks, then the use case ("…-dispute", "…-kyc").
    if (perCase()) { if (!dpStem) { dpStem = stem(); save(); } suggested = dpStem + '-' + (SUFFIX[selected] || selected); }
    else suggested = stem();
  }
  return suggested;
}

/**
 * One datapack for all use cases (the default), or one per use case: each use case starts truly empty, whatever the
 * others added, and starts over on its own. The page remembers each use case's datapack and switches to it with the tab.
 */
let layout = keep.get('workshop.layout') || 'shared';
let dpMap = keep.get('workshop.dpmap') || {};    // use case id → {name, id}, per-use-case layout
let dpStem = keep.get('workshop.dpstem') || null;
const perCase = () => layout === 'per';
const SUFFIX = {'dont-make-me-explain': 'dispute', 'what-changed': 'kyc', 'organization-learned': 'learned', 'loan-underwriting': 'loan'};
/** The selected use case's own datapack is the one in use (always true with one datapack for all). */
const mineInUse = () => !perCase() || !!(dpMap[selected] && dpMap[selected].id === status.store.datapackId);

function setLayout(v) {
  if (busy || v === layout) return;
  layout = v;
  // Stay on step 1: per use case, this use case chooses its own datapack here (new, or an existing one, the one in use
  // among them); back to one for all, the datapack in use serves every use case.
  suggested = null; lastMessage = ''; choosing = false; dpMode = null; dpPicked = null;
  step = 0; shown = null;
  save(); render();
}

/** Per use case: switches to the selected use case's datapack, if it has one (else its step 1 creates or picks one). */
async function useCaseDatapack(key = selected) {
  const m = perCase() && dpMap[key];
  if (!m || m.id === status.store.datapackId) return;
  busy = true; render(); say('Switching to ' + m.name + '…');
  try {
    const r = await fetch('/api/workshop/datapack?name=' + encodeURIComponent(m.name) + '&create=false&id=' + encodeURIComponent(m.id), {method: 'POST'});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    status = body;
    await loadRuns(status.store.contextId);
    if (pairOn() && pair.role === 'apac') await refreshLesson();
    say('');
  } catch (e) {
    // Gone (deleted in the Meko app, say): this use case chooses a datapack again at its step 1.
    delete dpMap[key]; save();
    step = 0; shown = null;
    say('Could not switch to ' + m.name + ' (' + e.message + '): choose a datapack for this use case.');
  }
  busy = false;
}

/** The account's datapacks for "Use existing", loaded when that option is chosen (null until then). */
let datapacks = null, loadingDatapacks = false, dpMode = null, dpPicked = null;
async function loadDatapacks() {
  if (loadingDatapacks) return;
  loadingDatapacks = true;
  try { datapacks = await (await fetch('/api/workshop/datapacks')).json(); } catch (e) { datapacks = []; }
  loadingDatapacks = false;
  render();
}

const ago = iso => {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  return isNaN(days) ? '' : days <= 0 ? 'created today' : days === 1 ? 'created yesterday' : 'created ' + days + ' days ago';
};

/** Where the datapack step goes: the shared picker draws into it once the step is on the page (see {@link #mountDatapack}). */
let dpListOnly = false;
function datapackForm(listOnly) {
  if (!status.store.keyed) return '<button class="btn" data-act="check"' + (busy ? ' disabled' : '') + '>' + icon('refresh') + 'Check again</button>';
  dpListOnly = !!listOnly;
  return '<div id="dpPick" style="width:100%"></div>';
}

/**
 * The datapack step, as every workshop page has it (the kit's picker): a new datapack or an existing one, the list
 * loading by itself, the one in use said as such. Above it, this workshop's own choice: one datapack for all use cases,
 * or one per use case. In the pair exercise's switch, the list alone, with the datapacks shared with you.
 */
function mountDatapack() {
  if (!el('dpPick')) return;
  // One datapack for all use cases, or one per use case.
  const lay = dpListOnly ? '' : '<div class="seg" role="tablist" aria-label="Datapacks" style="margin-top:14px">' +
    '<button role="tab" aria-selected="' + !perCase() + '" data-layout="shared">One datapack for all use cases</button>' +
    '<button role="tab" aria-selected="' + perCase() + '" data-layout="per">One datapack per use case</button></div>' +
    '<div class="hint">' + (perCase()
      ? 'Each use case has its own datapack, created at its own step 1: it starts empty whatever the others added, and starts over on its own. ' +
        (dpMap[selected] ? 'This use case: <b>' + esc(dpMap[selected].name) + '</b>.' : 'This use case has none yet.')
      : 'All the use cases share one datapack; each adds only its own context.') + '</div>';
  const inUse = status.store.live && status.store.connected && !choosing && mineInUse();
  // Left behind by Start over: offered for deletion, since what it holds (its agents' conversations above all) counts
  // against the account's limits.
  const left = leftBehind && !dpListOnly ? '<div class="callout warn flex"><span>You left <b>' + esc(leftBehind.name) + '</b> behind. Delete it to free what it holds: its conversations count against your account\'s limit.</span>' +
    '<button class="btn sm" id="dpDeleteLeft"' + (busy ? ' disabled' : '') + '>Delete ' + esc(leftBehind.name) + '</button></div>' : '';
  WK.datapackPicker(el('dpPick'), {
    mode: dpMode, only: dpListOnly ? 'existing' : null,
    inUse: inUse ? {id: status.store.datapackId || status.store.datapack, name: status.store.datapack} : null,
    // Your own datapacks; one shared with you only where it is the point (switching to the EU desk's, in pair mode).
    list: datapacks && datapacks.filter(d => dpListOnly || !d.sharedBy).map(d => ({id: d.id || d.name, name: d.name, meta: ago(d.created),
      // A workshop datapack of yours, not the one in use: it can be deleted from here.
      deletable: !!d.id && d.workshop && !d.sharedBy && !(inUse && d.id === status.store.datapackId),
      tag: d.sharedBy ? {label: 'shared with you by ' + d.sharedBy, cls: 'ok'} : d.workshop ? {label: 'workshop'}
        : {label: 'has other content', cls: 'warn', tip: 'It already holds context, so the stages would not start clean'}})),
    choice: dpPicked, name: suggestedName(), before: left + lay, busy,
    onDelete: dropDatapack,
    onMode: m => { if (busy) return; dpMode = m; if (m === 'existing') datapacks = null; render(); },
    onChoice: id => { dpPicked = id; },
    // What the participant types is the name: kept across re-renders (a busy state, an error), never replaced.
    onName: n => { suggested = n; },
    onRefresh: () => { if (datapacks != null && !loadingDatapacks) datapacks = null; loadDatapacks(); },
    onCreate: name => chooseDatapack(name, true, null),
    onUse: d => d ? chooseDatapack(d.name, false, d.id) : say('Pick a datapack from the list first.'),
  });
  if (el('dpDeleteLeft')) el('dpDeleteLeft').onclick = () => dropDatapack(leftBehind);
}

/** The datapack Start over left behind, offered for deletion until it is deleted or used again. */
let leftBehind = null;

/** Deletes a workshop datapack the participant is done with, after asking: everything in it goes. */
function dropDatapack(d) {
  if (!d || busy) return;
  const shared = !perCase();   // one datapack for all: every use case ran in it
  if (!confirm('Delete ' + d.name + '?\n\nIts memory, knowledge and conversations are deleted with it' + (shared ? ', for every use case that ran in it' : '') + '. This cannot be undone.')) return;
  busyWith('Deleting ' + d.name + '…', async () => {
    const r = await fetch('/api/workshop/datapack/delete?id=' + encodeURIComponent(d.id), {method: 'POST'});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    status = body;
    // Nothing of it is kept here: its progress, a use case that had it as its own, the offer to delete it.
    delete progressCache[d.id];
    Object.keys(dpMap).forEach(k => { if (dpMap[k].id === d.id) delete dpMap[k]; });
    if (leftBehind && leftBehind.id === d.id) leftBehind = null;
    datapacks = null; dpPicked = null;
    if (context === d.id) await loadRuns(status.store.contextId);
    save();
    return 'Deleted ' + d.name + ', and everything in it.';
  });
}

// ---------------------------------------------------------------- output
/** What a run's outcome amounts to: decided, handed to a person, or (for an audit) passed or not. */
function verdict(r) {
  // From the counts the agents recorded as they decided, not from the outcome's wording.
  const n = k => (r.verdicts || {})[k] || 0;
  if (r.audit) return n('findingsNotCompliant') ? ['bad', 'shield', 'Audit found issues'] : n('findingsUnverified') ? ['warn', 'shield', 'Could not be verified'] : ['ok', 'shield', 'Audit passed'];
  if (n('handedToPerson') && n('decided')) return ['warn', 'user', n('decided') + ' decided, ' + n('handedToPerson') + ' handed to a person'];
  if (n('handedToPerson')) return ['warn', 'user', 'Handed to a person'];
  return ['ok', 'check', 'Decided'];
}

const LAYERS = [['memory', 'Memory recalled'], ['book', 'Uploaded documents used'], ['history', 'Memory written before this run used'], ['promote', 'Collective memory used']];

function renderOutput() {
  const c = catalog[selected];
  const mine = runs[selected] || {};
  if (shown == null) shown = STEPS[step].stage ?? Math.max(-1, ...Object.keys(mine).map(Number));
  const track = '<h3>' + icon('route') + 'Stage by stage, as context is added <span class="count">pick a stage to see its run</span></h3>' +
    '<div class="stages" style="grid-template-columns:repeat(' + [0, 1, 2, 3].filter(s => stageNeeded(s)).length + ',minmax(0,1fr))">' +
    [0, 1, 2, 3].filter(s => stageNeeded(s)).map(s => stageCard(s, mine)).join('') + '</div>';
  const r = mine[shown];
  let detail;
  if (!r) {
    detail = '<div class="empty">' + icon('play', 'lg') + (shown >= 0 && stageNeeded(shown) ? stageName(shown) + ' has not been run yet. Go to its step and press Run.' : 'Run the use case to see what it sends to Meko and gets back.') + '</div>';
  } else {
    const v = verdict(r);
    detail = '<div class="outcome ' + v[0] + '">' + icon(v[1], 'lg') + '<div><b>' + esc(v[2]) + '.</b> ' + esc(r.outcome) + '</div></div>' +
      pillars(r) +
      '<div class="detail">' +
      '<div class="box"><h3>' + icon('user') + 'Conversation</h3><div class="chat">' + conversationHtml(r) + '</div></div>' +
      '<div class="box"><h3>' + icon('play') + 'What the agents did</h3>' +
        '<div class="legend">' + [['WORK', 'check', 'did the work'], ['ASK', 'ask', 'asked someone'], ['REWORK', 'redo', 'redid work'],
          ['CONTEXT', 'database', 'used or saved context']].map(([k, i, t]) => '<span><span class="k ' + k + '">' + icon(i) + '</span>' + t + '</span>').join('') + '</div>' +
        (r.steps || []).map(stepHtml).join('') + '</div>' +
      '<div class="box" style="grid-column:1 / -1">' + callsHtml(r.calls || []) + '</div>' +
      (status.store.live && status.store.connected ? '<div class="box" style="grid-column:1 / -1">' + learningHtml(r) + '</div>' : '') +
      '</div>';
  }
  const audit = audits[selected] && audits[selected][shown];
  el('output').innerHTML = track + detail + (audit ? auditHtml(c, audit) : '');
  document.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => { shown = Number(b.dataset.stage); renderOutput(); });
  document.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => learn(b.dataset.learn));
}

/** One stage: which layers of context it had, its verdict, its numbers and the change from the stage before. */
function stageCard(s, mine) {
  const c = catalog[selected];
  const r = mine[s];
  const note = (s === 1 && r && r.docsAs === 'one-line' ? 'One-line versions promoted (documents not uploaded)' : stageNote(s))
    + (pairOn() && r && r.datapack ? ' · in ' + r.datapack : '');
  const head = '<div class="h"><span class="t">' + esc(stageName(s)) + '</span><span class="n">' + 'step ' + stepNo(STEPS.findIndex(x => x.stage === s)) + '</span></div><div class="n">' + esc(note) + '</div>';
  if (!stageNeeded(s)) return '<div class="stage skip">' + head + '<div class="none">Not needed for this use case.</div></div>';
  if (!r) return '<button class="stage' + (s === shown ? ' sel' : '') + '" data-stage="' + s + '">' + head + '<div class="none">Not run yet.</div></button>';
  // The learning use case compares like with like: the same case with the lesson against it without; case 1 is another case.
  const prevStage = selected === LEARNS ? (s === 3 && mine[0] ? 0 : null)
    : [s - 1, s - 2, s - 3].find(p => p >= 0 && stageNeeded(p) && mine[p]);
  const prev = prevStage == null ? null : mine[prevStage];
  const comparable = prev && !prev.audit && !r.audit;
  // The first stage has no stage before it: the same story with no store at all is its reference.
  const base = !comparable && r.baseline ? r.baseline : null;
  const layers = '<div class="lyrs">' + LAYERS.map((l, i) => '<span class="' + ((r.layers || [])[i] ? 'on' : '') + '" title="' + esc(l[1]) + ((r.layers || [])[i] ? '' : ': no') + '">' + icon(l[0]) + '</span>').join('') + '</div>';
  const v = verdict(r);
  const measures = r.headline || c.headline;
  // What the arrows compare with, said once under the numbers and in words on each arrow.
  const against = comparable ? stageName(prevStage) : base ? 'no Meko at all' : null;
  const nums = measures.map(h => {
    const val = r.numbers[h[0]], p = comparable ? prev.numbers[h[0]] : base ? base[h[0]] : null;
    const words = p == null ? '' : Math.abs(val - p) + ' ' + (val < p ? 'fewer' : 'more') + ' than ' + against + ' (' + p + ' → ' + val + ')';
    const d = p == null || val === p ? '' : '<span class="delta ' + ((h[2] === 'lower') === (val < p) ? 'win' : 'lose') + '" title="' + esc(words) + '">'
      + (val < p ? '↓' : '↑') + Math.abs(val - p) + '</span>';
    return '<div class="metric"><span>' + esc(h[1]) + '</span><span><b>' + esc(val) + '</b>' + d + '</span></div>';
  }).join('');
  const ref = !against ? '' : '<div class="note">↓↑ compared with <b>' + esc(against) + '</b>' + (base
    ? ' (the same story, no store): ' + measures.map(h => esc(h[1]).toLowerCase() + ' ' + esc(base[h[0]])).join(' · ') : '') + '.</div>';
  return '<button class="stage' + (s === shown ? ' sel' : '') + '" data-stage="' + s + '">' + head + layers +
    '<span class="verdict ' + v[0] + '">' + icon(v[1]) + esc(v[2]) + '</span>' + nums + ref + '</button>';
}

/**
 * The four things Meko gives an agent, as this run actually got them: memory recalled (and who wrote it), knowledge
 * found, what was retrieved but passed over (the right context), and the decisions written to the record.
 */
function pillars(r) {
  const found = r.found || [], passed = r.passed || [], traces = r.traces || [];
  // Shared knowledge is what agents find by searching knowledge: documents that were uploaded, and collective memory
  // (facts promoted from memory). Memory proper is what agents wrote during the run, or other teams wrote before.
  const inKnowledge = f => /knowledge/i.test(f.source);
  const uploaded = f => /uploaded document/i.test(f.writtenBy);
  const oneLine = f => f.writtenBy === 'org-knowledge:curator';
  const mem = found.filter(f => !inKnowledge(f)), docs = found.filter(f => inKnowledge(f) && uploaded(f)), coll = found.filter(f => inKnowledge(f) && !uploaded(f));
  // What the run wrote and nobody read back during it: a memory for later, or a lesson promoted for other teams.
  const seen = t => found.some(f => String(f.text).slice(0, 60) === String(t).slice(0, 60));
  const promoted = (r.written || []).filter(w => w.kind === 'promoted');
  const wroteMem = (r.written || []).filter(w => w.kind === 'memory' && !seen(w.text) && !promoted.some(p => p.text === w.text));
  const promotedNew = promoted.filter(w => !seen(w.text));
  mem.push(...wroteMem.map(w => ({source: 'memory', writtenBy: w.agent, text: w.text, fresh: true, wrote: true})));
  coll.push(...promotedNew.map(w => ({source: 'knowledge', writtenBy: w.agent, text: w.text, fresh: true, wrote: true})));
  const item = (f, label) => '<div class="ctx"><div class="src">' + label + '</div>' + esc(f.text) + '</div>';
  const card = (ico, n, body, empty, count) => '<div class="pillar' + (body ? '' : ' off') + '"><h3><span class="ico">' + icon(ico) + '</span>' + n +
    (count ? ' <span class="count">' + count + '</span>' : '') + '</h3>' + (body || '<div class="note">' + empty + '</div>') + '</div>';
  const part = (title, list, render, empty) => '<div class="part"><div class="part-t">' + title + (list.length ? ' <span class="count">' + list.length + '</span>' : '') + '</div>' +
    (list.length ? list.map(render).join('') : '<div class="note">' + empty + '</div>') + '</div>';
  const knowledge = docs.length || coll.length
    ? part(icon('book') + 'Documents', docs, f => item(f, 'uploaded document'), 'No uploaded documents found.') +
      part(icon('promote') + 'Collective memory', coll, f => item(f, 'promoted ' + (f.fresh ? 'during this run ' : '') + 'by ' + esc(f.writtenBy) + (f.wrote ? ', for others to find' : '') +
        (oneLine(f) ? ' (a one-line version of a document)' : '')), 'Nothing promoted found.')
    : '';
  return '<div class="pillars">' +
    card('memory', 'Memory', mem.map(f => item(f, f.wrote ? 'written by ' + esc(f.writtenBy) + ' during this run, for later' : esc(f.source) + ', written ' + (f.fresh ? 'during this run ' : '') + 'by ' + esc(f.writtenBy))).join(''),
      'Nothing recalled: the agent had only what it was handed.', mem.length) +
    card('book', 'Shared knowledge', knowledge, 'Nothing found in shared knowledge yet: no documents, no collective memory.', docs.length + coll.length) +
    card('target', 'Right context', passed.map(p => '<div class="ctx passed"><div class="src">Passed over: ' + esc(p.reason) + '</div>' + esc(p.text) + '</div>').join(''), 'Nothing retrieved that had to be set aside.', passed.length) +
    card('route', 'Decision traces', traces.map(t => traceHtml(t)).join(''), 'No decisions traced.', traces.length) +
    '</div>';
}

const BASIS_NAME = {memory: 'Memory', documents: 'Documents', collective: 'Collective memory', 'set aside': 'Set aside'};

/** A decision's answer in words: its fields, without the JSON. */
function answerText(a) {
  try {
    const o = JSON.parse(a);
    if (o === null || typeof o !== 'object') return String(o);
    return Object.entries(o).filter(([, v]) => v !== null && v !== '' && !(Array.isArray(v) && !v.length))
      .map(([k, v]) => k.replace(/([A-Z])/g, ' $1').toLowerCase() + ': ' + (Array.isArray(v) ? v.join('; ') : typeof v === 'boolean' ? (v ? 'yes' : 'no') : v)).join(' · ');
  } catch (e) { return a; }
}

function traceHtml(t) {
  // What it rested on, from the context it read: grouped by pillar, set-aside items last.
  const groups = {};
  (t.basis || []).forEach(b => (groups[b.pillar] = groups[b.pillar] || []).push(b.name));
  const on = Object.keys(groups).length
    ? Object.keys(BASIS_NAME).filter(k => groups[k]).map(k => BASIS_NAME[k] + ': ' + groups[k].join(', ')).join('; ')
    : 'nothing retrieved: only what the agent was handed';
  const how = String(t.decidedBy || '').replace(/^rule \((.*)\)$/, 'rule: $1');
  return '<div class="ctx trace"><div class="q">' + esc(t.question) + '</div>' +
    '<div class="a">' + esc(answerText(t.answer)) + '</div>' +
    '<div class="m"><b>Based on</b> ' + esc(on) + '</div>' +
    // How much a model was given, only when a model decided: a rule reads no tokens (the figure is an estimate, length / 4).
    '<div class="m"><b>Decided by</b> ' + esc(how) + (t.byModel && t.context ? ', given about ' + esc(t.context) : '') + '</div></div>';
}

/**
 * The run's conversation: what people and agents said, as chat bubbles. Where nobody speaks (the agents work a case
 * between themselves), the case's conversation in Meko holds the agents' own records instead: shown as they wrote them.
 */
function conversationHtml(r) {
  if ((r.lines || []).length) return r.lines.map(lineHtml).join('');
  const records = (r.written || []).filter(w => w.kind === 'record');
  if (!records.length) return '<div class="note">Nothing said or recorded in this run.</div>';
  return '<div class="note" style="margin-bottom:6px">Nobody speaks in this use case: these are the records the agents wrote to the case\'s conversation in Meko.</div>' +
    records.map(w => '<div class="bubble agent record"><div class="who">' + esc(w.agent) + ' · ' + esc(String(w.label || '').replace(/^.*? · /, '')) + '</div>' + esc(w.text) + '</div>').join('');
}

/** A line of the conversation as a chat bubble: the person on the left, the agents on the right. */
function lineHtml(l) {
  if (l.sep) return '<div class="sep">' + esc(l.text) + '</div>';
  const person = /^(customer|borrower|developer|reviewer)$/i.test(l.speaker);
  return '<div class="bubble ' + (person ? 'person' : 'agent') + '"><div class="who">' + esc(l.speaker) + '</div>' + esc(l.text) + '</div>';
}

function stepHtml(s) {
  // Useful work (WORK) gets a check: a bare dot read as a missing icon beside the others.
  const k = {ASK: 'ask', REWORK: 'redo', CONTEXT: 'database'}[s.kind] || 'check';
  return '<div class="did ' + esc(s.kind) + '"><span class="k">' + icon(k) + '</span><span><span class="p">' + esc(s.persona) + '.</span> ' + esc(s.text) + '</span><span class="m">' + esc(s.minutes) + ' min</span></div>';
}

const READS = new Set(['memory_search', 'knowledgebase_search', 'conversation_get', 'artifact_get', 'context_search']);
function callsHtml(calls) {
  const reads = calls.filter(x => READS.has(x.tool)).length, failed = calls.filter(x => !x.ok).length;
  return '<h3>' + icon('database') + 'Meko calls <span class="count">' + calls.length + '</span></h3>' +
    '<div class="sum"><span class="pill">' + icon('read') + reads + ' reads</span><span class="pill">' + icon('write') + (calls.length - reads) + ' writes</span>' +
    (failed ? '<span class="pill warn">' + failed + ' failed</span>' : '') + '</div>' +
    '<table><thead><tr><th>Agent</th><th>Call</th><th>What was sent</th><th>Came back</th><th>ms</th></tr></thead><tbody>' +
    calls.map(x => '<tr><td>' + esc(x.agent) + '</td><td class="tool"><span class="' + (READS.has(x.tool) ? 'read' : 'write') + '">' + icon(READS.has(x.tool) ? 'read' : 'write') + esc(x.tool) + '</span></td>' +
      '<td>' + esc(x.detail) + '</td><td' + (x.ok ? '' : ' class="fail"') + '>' + (x.ok ? esc(x.hits) : 'failed') + '</td><td>' + esc(x.millis) + '</td></tr>').join('') +
    '</tbody></table>';
}

// ---------------------------------------------------------------- self-learning: Meko on the run's questions
/**
 * The questions a run's agents searched Meko with, as its receipts record them. Searches scoped to the run's own case
 * are left out: they are about this run's case, not what the datapack covers.
 */
function questionsOf(receipts) {
  const qs = receipts.filter(x => x.tool === 'memory_search' || x.tool === 'knowledgebase_search')
    .map(x => String(x.detail || '').replace(/^\[cached in this run\] /, ''))
    .filter(q => q && !q.startsWith('[this case]'));
  return [...new Set(qs)].slice(0, 8);
}
/** A run kept before questions were: what its (shortened) calls still say. */
const runQuestions = r => r.questions || questionsOf(r.calls || []);
const learning = {};   // use case id + stage → {check, replays, error, busy}
const learnKey = () => selected + ':' + shown;
const BAND = {high: 'ok', mid: '', low: 'warn'};
const bandPill = b => '<span class="pill ' + (BAND[b] ?? '') + '">' + esc(b || '?') + '</span>';
/** The questions of this use case's earlier stages: what a replay checks again now that more context is in. */
const earlierQuestions = () => [...new Set(Object.keys(runs[selected] || {}).map(Number).filter(s => s < shown)
  .flatMap(s => runQuestions(runs[selected][s])))];

function learningHtml(r) {
  const L = learning[learnKey()] || {};
  const qs = runQuestions(r), earlier = earlierQuestions();
  let h = '<h3>' + icon('bulb') + 'Self-learning: how well your datapack answers this run <span class="count">' + qs.length + ' questions</span></h3>' +
    '<p class="note">Meko rates every search made through <code>context_search</code> and lists what to add. <b>Check with Meko</b> asks this run\'s questions again that way, across memory, knowledge and conversations' +
    (earlier.length ? '; <b>Replay earlier weak searches</b> re-runs the ones an earlier stage\'s check found weak, to show whether what you added since fixed them' : '') +
    '. Each is a real search against your Meko search limit; the agents\' own run is not changed.</p>' +
    '<div class="row"><button class="btn" data-learn="check"' + (L.busy || !qs.length ? ' disabled' : '') + '>' + icon('refresh') + (L.check ? 'Check again' : 'Check with Meko') + '</button>' +
    (earlier.length ? '<button class="btn" data-learn="verify"' + (L.busy ? ' disabled' : '') + '>' + icon('redo') + 'Replay earlier weak searches</button>' : '') +
    (L.busy ? '<span class="note">' + esc(L.busy) + '</span>' : '') + (L.error ? '<span class="note fail">' + esc(L.error) + '</span>' : '') + '</div>';
  if (L.check) {
    h += '<table><thead><tr><th>Question the agents asked</th><th>Meko rated it</th><th>Found in</th><th>Meko\'s hint</th></tr></thead><tbody>' +
      L.check.checks.map(x => '<tr><td>' + esc(x.question) + '</td><td>' + bandPill(x.quality) + '</td><td>' +
        esc([x.memory && x.memory + ' memory', x.knowledge && x.knowledge + ' knowledge', x.conversation && x.conversation + ' conversation'].filter(Boolean).join(', ') || 'nothing') +
        '</td><td>' + esc(x.hint) + '</td></tr>').join('') + '</tbody></table>';
  }
  if (L.replays) {
    h += L.replays.length
      ? '<table><thead><tr><th>Earlier weak search</th><th>Before</th><th>Now</th><th>Meko says</th></tr></thead><tbody>' +
        L.replays.map(x => '<tr><td>' + esc(x.question) + '</td><td>' + bandPill(x.before) + '</td><td>' + bandPill(x.after) + '</td><td>' +
          esc(x.outcome + (x.hint ? ': ' + x.hint : '') + (x.indexing ? ' (a document is still indexing: replay again shortly)' : '')) + '</td></tr>').join('') + '</tbody></table>'
      : '<p class="note">No weak searches to replay: press <b>Check with Meko</b> on an earlier stage\'s run first, or every earlier search is already fixed.</p>';
  }
  const S = L.replays ? L.status : L.check;
  if (S && S.quality) {
    h += '<div class="sum" style="margin-top:10px"><span class="pill ok">Datapack quality: <b>' + esc(S.quality.pct) + '%</b> of ' + esc(S.quality.searches) + ' searches found a strong match</span>' +
      (S.quality.potential > S.quality.pct ? '<span class="pill">' + esc(S.quality.potential) + '% once the to-dos are done</span>' : '') + '</div>' +
      (S.todos || []).map(t => '<div class="note"><b>' + esc(t.title) + '</b> (' + esc(t.searches) + ' searches): ' + esc(t.why) +
        (t.examples.length ? ' For example: ' + t.examples.map(esc).join('; ') + '.' : '') + '</div>').join('');
  }
  return h;
}

/** Runs a self-learning check or replay for the run shown; it changes nothing the agents use. */
async function learn(what) {
  const key = learnKey(), r = (runs[selected] || {})[shown];
  if (!r) return;
  const L = learning[key] = Object.assign(learning[key] || {}, {busy: what === 'check' ? 'Asking Meko…' : 'Replaying…', error: null});
  renderOutput();
  try {
    const res = await fetch('/api/workshop/selflearning/' + what, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({questions: what === 'check' ? runQuestions(r) : earlierQuestions()})});
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    if (!body.available) throw new Error(body.reason);
    if (what === 'check') L.check = body;
    else { L.replays = body.replays; L.status = body; }
  } catch (e) {
    L.error = e.message;
  }
  L.busy = null;
  renderOutput();
}

function auditHtml(c, a) {
  const v = verdict(Object.assign({audit: true}, a));
  return '<div class="box" style="margin-top:12px"><h3>' + icon('shield') + esc(c.followUp.label) + ' <span class="count">given only the ' + esc(c.followUp.subject) + ' id</span></h3>' +
    '<div class="row">' + c.followUp.headline.map(h => '<span class="pill">' + esc(h[1]) + ': <b>' + esc(a.numbers[h[0]]) + '</b></span>').join('') + '</div>' +
    '<div class="outcome ' + v[0] + '">' + icon(v[1], 'lg') + '<div>' + esc(a.outcome) + '</div></div>' +
    '<div style="margin-top:10px">' + callsHtml(a.calls || []) + '</div></div>';
}

// ---------------------------------------------------------------- runs: the Meko lane only
/** The job of the run last started or followed: its result is recorded against it. */
let lastJob = null;

/** Records a run (or an audit) of a use case's stage in the progress datapack; the stand-in and pair mode keep it here. */
async function recordRun(useCase, stage, kind, r, job) {
  if (!remote() || pairOn(useCase)) { save(); return; }
  const at = progressCache[context] || (progressCache[context] = {runs: {}, audits: {}});
  ((kind === 'audit' ? at.audits : at.runs)[useCase] = (kind === 'audit' ? at.audits : at.runs)[useCase] || {})[stage] = r;
  try {
    const res = await fetch('/api/workshop/progress', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({context, contextName: status.store.datapack, useCase, stage, kind, run: r, job})});
    if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  } catch (e) {
    say('The run is on this page, but could not be recorded in Meko: ' + e.message);
  }
}

/** The same story's run without Meko, when the stage ran one alongside (the first stage): its numbers are the reference. */
let lastBaseline = null;

function stream(id, mode, meta = {}) {
  return new Promise((resolve, reject) => {
    let run = null, failed = null;
    lastBaseline = null;
    // With a baseline, the story also runs with no store at all: it reads and writes nothing in the datapack.
    const {baseline, ...rest} = meta;
    const q = Object.entries(rest).filter(([, v]) => v != null).map(([k, v]) => '&' + k + '=' + encodeURIComponent(v)).join('');
    const source = new EventSource('/api/stories/' + id + '/stream?mode=' + mode + '&mekoOnly=' + !baseline + q);
    source.addEventListener('job', e => { lastJob = JSON.parse(e.data).id; });
    source.addEventListener('run', e => { const d = JSON.parse(e.data); if (d.lane === 'without') lastBaseline = d.data; else run = d.data; });
    source.addEventListener('failed', e => { const d = JSON.parse(e.data); if (d.lane !== 'without') failed = d.data; });
    source.addEventListener('done', () => { source.close(); failed ? reject(new Error(failed)) : resolve(run); });
    source.onerror = () => { source.close(); reject(new Error('the run stream closed')); };
  });
}

const cut = (t, n) => { t = String(t == null ? '' : t); return t.length > n ? t.slice(0, n) + '…' : t; };

/**
 * What one decision rested on: the retrieved items that were in the context it read (found, or passed over), each with
 * the pillar it belongs to. Read from the decision's own context, not assumed from what kind of decision it is.
 */
function basisOf(read, run) {
  const flat = t => String(t || '').replace(/\s+/g, ' ').trim();
  const ctx = flat(read);
  if (!ctx) return [];
  const inCtx = t => { const k = flat(t).slice(0, 50); return k.length > 10 && ctx.includes(k); };
  const pillar = f => !/knowledge/i.test(f.source) ? 'memory' : /uploaded document/i.test(f.writtenBy) ? 'documents' : 'collective';
  const name = t => (String(t).match(/\b([A-Z]{2,}(?:-[A-Z0-9]+)+)\b/) || [])[1] || cut(flat(t), 60);
  const seen = new Set();
  return run.found.filter(f => inCtx(f.text)).map(f => ({pillar: pillar(f), name: name(f.text)}))
    .concat((run.passedOver || []).filter(p => inCtx(p.text)).map(p => ({pillar: 'set aside', name: name(p.text)})))
    .filter(b => { const k = b.pillar + b.name; if (seen.has(k)) return false; seen.add(k); return true; });
}

/** What a stage keeps of its run (or runs, for a series): numbers, dialogue, steps, the context Meko returned, every call. */
function keepRun(list, headline) {
  const numbers = {};
  headline.forEach(h => numbers[h[0]] = list.reduce((t, r) => t + (r.metrics[h[0]] || 0), 0));
  const many = list.length > 1;
  // Context the agents wrote to Meko earlier in the same run is marked as such: an empty datapack still has what the run
  // itself writes. Case memory is read scoped to this run's case, so all of it was written during the run; knowledge
  // is fresh if this run promoted it (memory_add keeps the text as written, so the promoted text is what comes back).
  const promotedHere = list.flatMap(r => (r.written || []).filter(w => w.kind === 'promoted').map(w => String(w.text).slice(0, 60)));
  const fresh = f => f.source === 'case memory' || (/knowledge/i.test(f.source) && promotedHere.some(p => String(f.text).startsWith(p)));
  const found = list.flatMap(r => r.found.map(f => ({source: f.source, writtenBy: f.writtenBy, text: cut(f.text, 300), fresh: fresh(f)}))).slice(0, 40);
  const knowledge = found.filter(f => /knowledge/i.test(f.source));
  const uploaded = f => /uploaded document/i.test(f.writtenBy);
  const verdicts = {};
  ['decided', 'handedToPerson', 'findingsCompliant', 'findingsNotCompliant', 'findingsUnverified']
    .forEach(k => verdicts[k] = list.reduce((t, r) => t + (r.metrics[k] || 0), 0));
  return {
    numbers,
    outcome: cut(list.map(r => r.outcome).join(' '), 600),
    verdicts,
    // How the run found its policies: as uploaded documents, or only as their promoted one-line versions.
    docsAs: knowledge.some(uploaded) ? 'uploaded' : knowledge.some(f => f.writtenBy === 'org-knowledge:curator') ? 'one-line' : 'missing',
    // Which context the run used, from what it found: memory recalled, uploaded documents, memory written before this
    // run (another team's, or an earlier review), and collective memory.
    layers: [found.some(f => !/knowledge/i.test(f.source)),
      knowledge.some(uploaded),
      found.some(f => !/knowledge/i.test(f.source) && !f.fresh),
      knowledge.some(f => !uploaded(f))],
    lines: list.flatMap((r, i) => (many ? [{sep: true, text: 'Case ' + (i + 1)}] : []).concat(
      r.transcript.filter(l => l.dialogue).map(l => ({speaker: l.speaker, text: cut(l.text, 400)})))).slice(0, 150),
    steps: list.flatMap(r => r.steps.map(s => ({persona: s.persona, text: cut(s.text, 300), kind: s.kind, minutes: s.minutes}))).slice(0, 120),
    found,
    // What the run itself wrote, in full: its records in the case's conversation, memories, and what it promoted.
    written: list.flatMap(r => (r.written || []).filter(w => w.kind !== 'turn').map(w => ({agent: w.agent, kind: w.kind, label: w.label, text: cut(w.text, 400)}))).slice(0, 60),
    passed: list.flatMap(r => r.passedOver.map(p => ({text: cut(p.text, 200), reason: p.reason}))).slice(0, 20),
    calls: list.flatMap(r => r.receipts.map(x => ({agent: x.agent, tool: x.tool, detail: cut(x.detail, 160), hits: x.hits, ok: x.ok, millis: x.millis}))).slice(0, 200),
    questions: questionsOf(list.flatMap(r => r.receipts)),
    // Each decision the agents made, as traced to the record: the question, the answer, who decided and on how much context.
    traces: list.flatMap(r => (r.decisions || []).map(d => ({gate: d.gate, persona: d.persona, question: cut(d.question, 260), answer: cut(d.answer, 600),
      decidedBy: cut(d.decidedBy, 200), context: d.context, byModel: d.byModel, basis: basisOf(d.read, r)}))).slice(0, 30)};
}

async function runSelected() {
  const id = selected, at = step, stage = STEPS[at].stage, c = catalog[id];
  // The datapack may have changed outside this page (an upload in the Meko app): check it before running a stage.
  status = await (await fetch('/api/workshop/status')).json();
  if (pairOn() && pair.role === 'apac' && stage === 3) await refreshLesson();
  const blocked = earlierOpen(at) || stageBlocked(stage);
  if (blocked) throw new Error(blocked);
  if (stage === 3) {
    const f = finale();
    if (f.rerun) await runStage(id, 3);
    if (f.audit) {
      const a = keepRun([await stream(id, 'followup', {useCase: id, stage: 3, kind: 'audit'})], c.followUp.headline);
      placeAudit(id, a);
      await recordRun(id, 3, f.rerun ? 'audit' : 'run', f.rerun ? a : runs[id][3], lastJob);
    }
    if (step === at) shown = 3;
    return 'Done: ' + c.title + ', ' + stageName(3) + (f.audit ? ' and ' + c.followUp.label.toLowerCase() : '') + '.';
  }
  await runStage(id, stage);
  if (step === at) shown = stage;
  return 'Done: ' + c.title + ', ' + stageName(stage) + '.';
}

async function runStage(id, stage) {
  const c = catalog[id];
  // A KYC review compares with the latest review: a new cycle keeps it from comparing with its own last run.
  if (id === 'what-changed') await post('/api/stories/what-changed/reset');
  let r;
  if (id === LEARNS && pairOn()) {
    // Pair: case 1 by the EU desk (a new epoch), the APAC desk's baseline (shares nothing), then its case again in
    // the epoch of the lesson its partner promoted, as the shared datapack holds it.
    const at = stage === 2 ? '?index=0&otherTeam=true' : stage === 0 ? '?index=1&share=false' : '?index=1&epoch=' + encodeURIComponent(lesson.epoch);
    const res = await post('/api/stories/' + LEARNS + '/case' + at + '&useCase=' + LEARNS + '&stage=' + stage);
    lastJob = res.job || null;
    r = keepRun([res.run], c.headline);
  } else if (id === LEARNS) {
    // Case 2 without the lesson (a new epoch), case 1 by the other team (a new epoch, kept), case 2 again in that epoch.
    const at = {0: '?index=1&share=false', 2: '?index=0&otherTeam=true', 3: '?index=1&epoch=' + encodeURIComponent(((runs[id] || {})[2] || {}).epoch || '')}[stage];
    const res = await post('/api/stories/' + LEARNS + '/case' + at + '&useCase=' + LEARNS + '&stage=' + stage);
    lastJob = res.job || null;
    r = keepRun([res.run], c.headline);
    if (stage === 2) r.epoch = res.epoch;
  } else {
    // The first stage also runs the story with no store at all: its numbers are what the empty datapack is measured against.
    r = keepRun([await stream(id, 'compare', {useCase: id, stage, kind: 'run', baseline: stage === 0})], c.headline);
    if (stage === 0 && lastBaseline) r.baseline = keepRun([lastBaseline], c.headline).numbers;
  }
  // Which datapack the run used: the pair exercise compares runs across two.
  r.datapack = status.store.datapack; r.datapackId = status.store.datapackId;
  (runs[id] = runs[id] || {})[stage] = r;
  await recordRun(id, stage, 'run', r, lastJob);
}

/** An audit's place: beside the run it follows when the finale reruns, else the stage's run itself. */
function placeAudit(id, a) {
  const c = catalog[id];
  if (promotes(id)) (audits[id] = audits[id] || {})[3] = a;
  else (runs[id] = runs[id] || {})[3] = Object.assign(a, {audit: true, headline: c.followUp.headline});
}

/**
 * Picks up the run the server still has: one still running (a reload, another browser) is followed from its start; one
 * that finished with no page listening is replayed. Either way its result is kept as the step that started it would
 * have kept it, and recorded.
 */
async function pickUp(job) {
  if (!job || !job.useCase || !catalog[job.useCase] || job.stage == null || busy) return;
  const id = job.useCase, stage = Number(job.stage), c = catalog[id], kind = job.kind;
  const stepAt = STEPS.findIndex(x => x.stage === stage);
  busy = true; running = {useCase: id, step: stepAt, text: 'Picking up ' + c.title + ', ' + stageName(stage, id)};
  render(); say(running.text + '…');
  try {
    const got = await new Promise((resolve, reject) => {
      let result = null, failed = null;
      const source = new EventSource('/api/stories/jobs/' + encodeURIComponent(job.id) + '/stream');
      source.addEventListener('run', e => { const d = JSON.parse(e.data); if (d.lane === 'without') result = Object.assign(result || {}, {baseline: d.data}); else result = Object.assign(result || {}, {run: d.data}); });
      source.addEventListener('case', e => { result = JSON.parse(e.data); });
      source.addEventListener('failed', e => { failed = JSON.parse(e.data).data; });
      source.addEventListener('done', () => { source.close(); failed && !result ? reject(new Error(failed)) : resolve(result); });
      source.onerror = () => { source.close(); reject(new Error('the run stream closed')); };
    });
    if (!got) throw new Error('the run ended with no result');
    if (kind === 'audit') {
      const a = keepRun([got.run], c.followUp.headline);
      placeAudit(id, a);
      await recordRun(id, 3, promotes(id) ? 'audit' : 'run', promotes(id) ? a : runs[id][3], job.id);
    } else {
      const r = keepRun([got.run], c.headline);
      if (got.baseline) r.baseline = keepRun([got.baseline], c.headline).numbers;
      if (id === LEARNS && stage === 2 && got.epoch) r.epoch = got.epoch;
      r.datapack = status.store.datapack; r.datapackId = status.store.datapackId;
      (runs[id] = runs[id] || {})[stage] = r;
      await recordRun(id, stage, 'run', r, job.id);
    }
    say('Picked up: ' + c.title + ', ' + stageName(stage, id) + '.');
  } catch (e) {
    say('Could not pick up the last run: ' + e.message);
  }
  busy = false; running = null; pendingJob = null; save(); render();
}

/** Moves to the next (or previous) step the selected use case needs. */
function go(dir) {
  const mine = mySteps(), at = mine.indexOf(step);
  step = mine[Math.max(0, Math.min(mine.length - 1, (at < 0 ? 0 : at) + dir))]; shown = STEPS[step].stage ?? shown; lastMessage = ''; save();
}

let lastMessage = '';
/** What the datapack holds for the selected use case, in a line: its own documents and history, not the others'. */
function datapackNote() {
  const u = status.useCases.find(x => x.id === selected);
  const docs = !u.documents.length ? null : u.documents.every(k => docIn(status.documents[k]))
    ? 'its documents are in the datapack' : 'its documents are not in the datapack yet';
  const hist = !u.history ? null : status.history[selected] === 'seeded' ? 'last quarter\'s reviews are in it' : 'last quarter\'s reviews are not added yet';
  const parts = [docs, hist].filter(Boolean);
  return catalog[selected].title + ': ' + (parts.length ? parts.join('; ') : 'nothing to add to the datapack') + '.';
}
/** The status line: toned by what it says (the kit's callout), so a missing piece or an error stands out. */
function say(m) { lastMessage = m || ''; if (el('status')) WK.status(el('status'), lastMessage); }

/** What is running, and from which step: the steps stay browsable meanwhile, and the running pill goes back to it. */
let running = null;
async function busyWith(message, work) {
  if (busy) return;
  busy = true; running = {useCase: selected, step, text: message.replace(/…$/, '')}; render(); say(message);
  try { say(await work()); } catch (e) { say('Error: ' + e.message); }
  busy = false; running = null; save(); render();
}

async function act(what) {
  if (busy) return;
  if (what === 'shared') {
    // Shared only once case 1 is solved: there is nothing to share before.
    const open = earlierOpen(step);
    if (open) { say(open); return; }
    pair.shared = true; save(); render(); say('Tell your partner the datapack\'s name: ' + (status.store.datapack || '') + '.'); return; }
  if (what === 'restart') {
    // A datapack is durable: nothing in it is cleared by a restart. A fresh start is a fresh datapack.
    suggested = null; choosing = true;
    // The datapack left behind: offered for deletion on step 1.
    const mine = perCase() ? dpMap[selected] : (status.store.live && status.store.connected ? {id: status.store.datapackId, name: status.store.datapack} : null);
    leftBehind = mine && mine.id && /^meko-workshop/.test(mine.name || '') ? {id: mine.id, name: mine.name} : null;
    if (perCase()) delete dpMap[selected];   // only this use case starts over
    if (pairOn()) resetPair();
    // What ran belongs to the datapack left behind (it stays recorded with it): off the page until a new one is chosen.
    // One datapack per use case: only this use case's runs; one for all: every use case's.
    if (perCase()) { delete runs[selected]; delete audits[selected]; }
    else [runs, audits].forEach(o => Object.keys(o).forEach(k => delete o[k]));
    learning[selected + ':0'] = learning[selected + ':1'] = learning[selected + ':2'] = learning[selected + ':3'] = undefined;
    step = STEPS.findIndex(x => x.t === 'Create your datapack'); shown = null; save(); render();
    say(perCase() ? 'Name a new datapack for ' + catalog[selected].title + ' and press Create and use: the other use cases keep theirs.'
      : 'Name a new datapack and press Create and use: everything after this is written to it.'); return;
  }
  const at = step;
  await busyWith(what === 'check' ? 'Checking your datapack…' : what === 'documents' ? 'Adding the one-line versions…' : what === 'upload' ? 'Uploading the documents…' : 'Adding last quarter\'s reviews…', async () => {
    status = what === 'check' ? await (await fetch('/api/workshop/status')).json() : await post('/api/workshop/' + what + '?useCase=' + encodeURIComponent(selected));
    if (status.store.contextId !== context) { await loadRuns(status.store.contextId); resume(); }
    // A step that adds to the datapack moves on once it is complete (on Check too, after an upload in the Meko app).
    if (pairOn() && pair.role === 'apac') await refreshLesson();
    if (step === at && STEPS[step].done && STEPS[step].stage == null && step > 0 && STEPS[step].done()) go(1);
    // An upload says what became of each document (a failure says why, such as a storage quota).
    if (what === 'upload' && status.uploaded) return Object.entries(status.uploaded).map(([k, v]) => k + ': ' + v).join(' · ') + '.';
    return datapackNote();
  });
}

function bind() {
  mountDatapack();
  document.querySelectorAll('[data-run]').forEach(b => b.onclick = () => busyWith('Running ' + catalog[selected].title + ' with Meko…', runSelected));
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
  document.querySelectorAll('[data-pair]').forEach(b => b.onclick = () => b.dataset.pair === 'solo' ? setPair('solo') : setPair('pair', b.dataset.pair));
  document.querySelectorAll('[data-layout]').forEach(b => b.onclick = () => setLayout(b.dataset.layout));
}

/** Creates a datapack, or uses an existing one; then on to the first step it still needs. */
function chooseDatapack(name, create, id) {
  if (!name) { say(create ? 'Name the datapack first.' : 'Pick a datapack from the list first.'); return; }
  const at = step;
  busyWith((create ? 'Creating ' : 'Switching to ') + name + '…', async () => {
    // A new one is filed in the workshop's Meko project: under BFSI when it is this use case's own, else under All use cases.
    const r = await fetch('/api/workshop/datapack?name=' + encodeURIComponent(name) + '&create=' + create
      + (create ? '&group=' + (perCase() ? 'bfsi' : 'all') : id && id !== name ? '&id=' + encodeURIComponent(id) : ''), {method: 'POST'});
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || r.statusText);
    status = body;
    if (perCase()) dpMap[selected] = {name: status.store.datapack, id: status.store.datapackId};   // this use case's own
    // A new datapack in pair mode is a new start for this role (switching to the partner's shared one is not).
    if (create && pairOn()) resetPair();
    suggested = null;   // the next new datapack gets a new name
    choosing = false;   // the name is now the datapack in use
    if (leftBehind && leftBehind.id === status.store.datapackId) leftBehind = null;   // chosen again: not left behind
    datapacks = null;   // the list now includes it
    dpMode = null; dpPicked = null;
    // Another datapack: its own runs, read back from its record (none, for a new one).
    await loadRuns(status.store.contextId);
    shown = null;
    if (pairOn() && pair.role === 'apac') await refreshLesson();
    // A selection is a setup step: on to the first step this datapack still needs, if the participant is still on the
    // step that chose it.
    if (status.store.live && status.store.connected && step === at) resume();
    const filed = body.filed ? ' Filed in the ' + body.filed + ' project folder.' : body.fileError ? ' ' + body.fileError : '';
    return (create ? 'Created and using ' : 'Using ') + name + '.' + filed + ' ' + datapackNote();
  });
}

function renderStatus() {
  const s = status.store;
  const meko = s.live ? (s.connected ? 'live' : 'not connected') : s.keyed ? 'no datapack yet' : 'offline stand-in';
  // The workshop runs without model calls by design: only worth a word when models are on.
  el('env').innerHTML =
    '<div class="row2"><span>Datapack</span><b title="' + esc(s.datapack || '') + '">' + esc(s.live && s.connected ? s.datapack || '' : '—') + '</b></div>' +
    '<div class="row2"><span>Meko</span><span><span class="pill ' + (s.live && s.connected ? 'ok' : 'warn') + '" title="' + esc(s.error || s.note || '') + '">' + esc(meko) + '</span></span></div>' +
    '<div class="row2"><span>Datapacks</span><b>' + (perCase() ? 'one per use case' : 'one for all') + '</b></div>' +
    (/^on/.test(s.models) ? '<div class="row2"><span>Models</span><b>on</b></div>' : '');
}
const nav = WK.guard(dir => { go(dir); render(); window.scrollTo({top: 0, behavior: 'smooth'}); });
el('prev').onclick = () => nav(-1);
el('next').onclick = () => nav(1);
el('startOver').onclick = () => act('restart');
el('running').onclick = () => {
  if (!running) return;
  step = running.step; shown = STEPS[step].stage ?? shown; lastMessage = ''; save(); render();
};

/** New Session, Same Context, under its own key in the per-use-case layout. */
const SESSIONS = 'new-session';

/** Tells the New Session page to look again at the datapack in use, and whether it needs one of its own (per use case). */
function tellSessions() {
  const frame = el('startFrame');
  if (frame.contentWindow && frame.src) frame.contentWindow.postMessage({refresh: true, layout, needsOwn: perCase() && !dpMap[SESSIONS],
    theme: currentTheme()}, location.origin);
}
el('startFrame').addEventListener('load', tellSessions);

// The New Session page reports its height (the frame takes it, so the page scrolls as one) and the datapacks it creates.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.sessionsHeight) el('startFrame').style.height = e.data.sessionsHeight + 'px';
  // The layout chosen on that page's datapack step is the workshop's: one for all, or one per use case.
  if (e.data.setLayout && !busy) {
    setLayout(e.data.setLayout);
    useCaseDatapack(SESSIONS).then(() => { render(); tellSessions(); });
  }
  // A datapack created there: New Session's own (per use case), or the workshop's (one for all), with its runs.
  if (e.data.datapackChanged) {
    // The status the change answered with, when it came with it: no second round of searches.
    (e.data.status && e.data.status.store ? Promise.resolve(e.data.status) : fetch('/api/workshop/status').then(r => r.json())).then(st => {
      status = st;
      if (perCase()) dpMap[SESSIONS] = {name: status.store.datapack, id: status.store.datapackId};
      choosing = false; suggested = null;
      loadRuns(status.store.contextId).then(() => {
        if (!busy) openUseCase();
        // Not told to refresh: the New Session page just did, and now has a datapack of its own.
        save(); render();
      });
    });
  }
});

function render() {
  if (!status) return;
  // Start here: its own page in place of the use case, its steps and its output.
  el('app').hidden = startHere;
  el('starthere').hidden = !startHere;
  if (startHere && !el('startFrame').src) el('startFrame').src = '/sessions.html?embedded&from=workshop&t=' + Date.now();   // always this start's page
  renderStatus(); renderTabs(); renderUseCase(); renderStepper(); renderNav();
  el('guide').innerHTML = guide();
  renderOutput(); bind(); say(lastMessage);
}

(async () => {
  try {
    (await (await fetch('/api/stories')).json()).forEach(s => catalog[s.id] = s);
    status = await (await fetch('/api/workshop/status')).json();
    if (!status.useCases.some(u => u.id === selected)) selected = status.useCases[0].id;
    await loadRuns(status.store.contextId);
    await useCaseDatapack(startHere ? SESSIONS : selected);   // per use case: the shown tab's own datapack
    if (pair.mode === 'pair' && pair.role === 'apac') await refreshLesson();
    openUseCase();
    lastMessage = '';
    render();
    // A run the server still has (a reload in the middle of it, or one that finished with no page listening).
    if (pendingJob && !pendingJob.recorded) pickUp(pendingJob);
  } catch (e) { el('guide').textContent = 'Unable to load the workshop: ' + e.message; }
})();
</script>
