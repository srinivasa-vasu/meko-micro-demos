<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meko Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/workshop-kit/workshop.css">
<style>
/* This page's own names for the kit's colours: they follow its theme (light, dark, or the system's). */
:root{--panel:var(--surface);--panel2:var(--surface-2);--chip:var(--sunken);--text2:var(--ink-2);--blue:var(--info);--btn:var(--surface);--on-accent:var(--accent-ink);
  --accent-bg:var(--accent-soft);--warn-bg:var(--warn-soft);--bad-bg:var(--bad-soft);--blue-bg:var(--info-soft);--violet-bg:color-mix(in srgb,var(--violet) 14%,transparent);
  --hover:var(--surface-2);--active:var(--accent-soft);--cust-bg:var(--sunken);--agent-bg:var(--accent-soft);--spec-bg:var(--warn-soft);
  --warn-tint:color-mix(in srgb,var(--warn) 7%,transparent);--bad-tint:color-mix(in srgb,var(--bad) 7%,transparent);--blue-tint:color-mix(in srgb,var(--info) 7%,transparent);
  --boundary-bg:var(--surface-2);--boundary-line:var(--line)}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}
svg.i.lg{width:20px;height:20px}
.dp-panel{margin-top:10px}
/* An option with a second line: what it is, then who you are in it. */
.seg button .role{display:block;font-size:11.5px;font-weight:500;opacity:.8;margin-top:1px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:4px}
.dp-list{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto;max-width:720px}
.dp{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);cursor:pointer}
.dp:has(input:checked){border-color:var(--accent)}
.dp.other .dp-n{color:var(--muted)}
.dp-n{font-weight:700}.dp-m{font-size:12px;color:var(--muted);margin-right:auto}
input.text{min-width:300px;width:auto}
h3 .count{color:var(--muted);font-weight:400;font-family:var(--body)}
.note{font-size:12.5px;color:var(--muted)}
code{font-size:12px}

/* The step, in the main column */
.guide h2{font-size:21px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.guide ol{margin:12px 0 14px;padding-left:20px;color:var(--text2);max-width:100ch}.guide li{margin:5px 0}
.guide .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* The use case and what the datapack holds, in the insight column */
.ucd .domain{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ucd .problem{color:var(--text2);font-size:13.5px;margin-top:6px}
.boundary{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--text2);background:var(--boundary-bg);border:1px dashed var(--boundary-line);border-radius:9px;padding:7px 10px}
.challenge{margin-top:10px;font-style:italic;color:var(--muted);font-size:13px}
.reads .r{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;font-size:13px;color:var(--text2)}
.reads .r .ico{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--chip);color:var(--muted);flex:none}
.reads .r.on .ico{background:var(--accent-bg);color:var(--accent)}
.reads .r.off{color:var(--muted)}
.env .pill{white-space:normal}

/* Output: the stage track, then one stage's run */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stage{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);min-width:0;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.stage.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.skip{opacity:.4;border-style:dashed;cursor:default}
.stage .h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.stage .n{font-size:11.5px;color:var(--muted)}
.stage .t{font-weight:800;font-size:13.5px}
.lyrs{display:flex;gap:5px}
.lyrs span{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--chip);color:var(--line)}
.lyrs span.on{background:var(--accent-bg);color:var(--accent)}
.verdict{gap:6px;align-items:center}
.verdict.ok{background:var(--accent-bg);color:var(--accent)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.metric{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.metric b{font-size:17px;color:var(--ink)}
.delta{font-size:11.5px;font-weight:800;margin-left:5px}.win{color:var(--accent)}.lose{color:var(--bad)}
.stage .none{color:var(--muted);font-size:12.5px}
.outcome{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--panel2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;margin-top:14px}
.outcome.warn{border-left-color:var(--warn)}.outcome.bad{border-left-color:var(--bad)}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.pillar{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);min-width:0;max-height:320px;overflow:auto}
.pillar h3{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.pillar h3 .ico{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent)}
.pillar.off h3 .ico{background:var(--chip);color:var(--muted)}
.part{margin-top:6px}.part + .part{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.part-t{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--text2)}
.ctx{font-size:12.5px;padding:7px 9px;border-radius:8px;background:var(--panel);margin:5px 0;color:var(--text2)}
.ctx.trace .q{font-weight:700;color:var(--ink)}
.ctx.trace .a{margin-top:3px;color:var(--accent)}
.ctx.trace .m{margin-top:3px;font-size:12px;color:var(--muted)}.ctx.trace .m b{color:var(--text2);font-weight:700}
.ctx .src{font-size:11.5px;font-weight:700;color:var(--accent);margin-bottom:2px}
.ctx.passed .src{color:var(--warn)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.out .box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2);min-width:0}
.out h3{font-size:14px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.chat{display:flex;flex-direction:column;gap:6px;max-height:460px;overflow:auto;padding-right:4px}
.bubble{max-width:85%;border-radius:12px;padding:7px 10px;font-size:13px;overflow-wrap:anywhere;min-width:0}
.bubble .who{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:1px}
.bubble.person{align-self:flex-start;background:var(--cust-bg);border-bottom-left-radius:4px}
.bubble.agent{align-self:flex-end;background:var(--agent-bg);border-bottom-right-radius:4px}
/* Records the agents wrote (nobody speaks): a log, full width, not one side of a dialogue. */
.bubble.record{align-self:stretch;max-width:none;border-radius:8px}
.chat .sep{align-self:center;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:6px}
.did{display:flex;gap:8px;font-size:12.5px;padding:6px 8px;border-radius:8px;margin:4px 0;align-items:flex-start}
.did .k{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;flex:none;background:var(--chip);color:var(--muted)}
.did.ASK{background:var(--warn-tint)}.did.ASK .k{background:var(--warn-bg);color:var(--warn)}
.did.REWORK{background:var(--bad-tint)}.did.REWORK .k{background:var(--bad-bg);color:var(--bad)}
.did.CONTEXT{background:var(--blue-tint)}.did.CONTEXT .k{background:var(--blue-bg);color:var(--blue)}
/* Plain work: the bare icon, as in the legend; a check in a filled square reads as a checkbox. */
.did.WORK .k{background:transparent}
.did .p{font-weight:700}.did .m{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;gap:5px;align-items:center}
/* The legend's icons in the rows' own badges, so each reads as the step it labels. */
.legend .k{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--chip);color:var(--muted)}
.legend .k.WORK{background:transparent}.legend .k.ASK{background:var(--warn-bg);color:var(--warn)}
.legend .k.REWORK{background:var(--bad-bg);color:var(--bad)}.legend .k.CONTEXT{background:var(--blue-bg);color:var(--blue)}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.out table{font-size:12.5px}
td.tool{white-space:nowrap}
.tool span{display:inline-flex;gap:5px;align-items:center;font:11.5px var(--mono);border-radius:6px;padding:2px 6px}
.tool .read{background:var(--blue-bg);color:var(--blue)}.tool .write{background:var(--violet-bg);color:var(--violet)}
td.fail{color:var(--bad);font-weight:700}.note.fail{color:var(--bad)}
.empty{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px;margin-top:14px}
#starthere iframe{width:100%;height:2100px;border:0;display:block}
@media(max-width:1100px){.detail{grid-template-columns:minmax(0,1fr)}.stages,.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:no-preference){.stage,.btn{transition:border-color .15s,background .15s,box-shadow .15s}}
</style>
</head>
<body>
<header class="topnav">
  <span class="mark" aria-hidden="true" id="brandMark"></span>
  <div class="brandtxt">Meko workshop<small>Same agents. Only the context changes.</small></div>
  <nav class="uctabs" id="tabs" role="tablist" aria-label="Use cases"></nav>
</header>
<!-- Start here: "New session. Same context.", its own page, shown in place of a use case. -->
<section id="starthere" hidden><iframe id="startFrame" title="New session. Same context."></iframe></section>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <span class="k" id="ucDomain"></span>
      <h1 id="ucTitle"></h1>
    </div>
    <div class="stepshead"><span>Steps</span>
      <button class="linkbtn" id="startOver" title="A datapack keeps everything written to it, across restarts: starting over means a new one">↺ Start over</button></div>
    <nav class="steps" id="stepper" aria-label="Workshop steps"></nav>
    <div class="env" id="env"></div>
    <div class="side-foot">
      <button class="btn iconbtn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">◐</button>
      <span class="small muted">Same agents. Same code. Only the context changes.</span>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <span class="eyebrow" id="eyebrow"></span>
      <button class="pill warn" id="running" hidden title="Go to the step that is running"></button>
    </div>
    <section class="card guide" id="guide"></section>
    <div class="nav">
      <button class="btn ghost" id="prev">← Back</button>
      <span class="row"><span class="why" id="nextWhy"></span><button class="btn" id="next">Next →</button></span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <section class="card out" id="output"></section>
  </main>

  <aside class="insight">
    <div class="box ucd" id="usecase"></div>
    <div class="box reads" id="reads"></div>
  </aside>
</div>
<script src="/workshop-kit/workshop.js"></script>
<script>
const el = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[c]));
const post = async url => { const r = await fetch(url, {method: 'POST'}); if (!r.ok) throw new Error((await r.text()) || r.statusText); return r.json(); };
const keep = {get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
              set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* not kept */ } }};

// ---------------------------------------------------------------- icons (stroke icons, inline)
const PATHS = {
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  upload: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 18v-6M9 15l3-3 3 3"/>',
  history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
  promote: '<path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',
  bank: '<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/>',
  id: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.5 1.7-2.2 3-2.2s2.4.7 3 2.2M14 10h4M14 14h3"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  memory: '<path d="M12 5a3 3 0 0 0-6 .5A3 3 0 0 0 4 11a3 3 0 0 0 2 5.5A3 3 0 0 0 12 19z"/><path d="M12 5a3 3 0 0 1 6 .5A3 3 0 0 1 20 11a3 3 0 0 1-2 5.5A3 3 0 0 1 12 19z"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  route: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  read: '<path d="M17 7L7 17M7 9v8h8"/>',
  write: '<path d="M7 17L17 7M9 7h8v8"/>',
  ask: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/>',
  redo: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  dot: '<circle cx="12" cy="12" r="3"/>',
  boundary: '<path d="M12 3v18" stroke-dasharray="3 3"/><path d="M4 8l4 4-4 4M20 8l-4 4 4 4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  left: '<path d="M15 18l-6-6 6-6"/>', right: '<path d="M9 18l6-6-6-6"/>', trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  refresh: '<path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>'};
const icon = (name, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + PATHS[name] + '</svg>';

// ---------------------------------------------------------------- theme (this browser only)
// Stored plain ("light", as the demo page stores it); this page once stored it as JSON ("\"light\""): read either.
try { const v = localStorage.getItem('theme'); if (v && v.includes('"')) localStorage.setItem('theme', v.replace(/"/g, '')); } catch (e) { /* not kept */ }
/** The theme in effect; the New Session page is its own document, and follows this page's. */
const currentTheme = WK.theme(el('themeBtn'), 'theme', t => {
  const frame = el('startFrame');
  if (frame && frame.contentWindow && frame.src) frame.contentWindow.postMessage({theme: t}, location.origin);
});
el('brandMark').innerHTML = icon('database', 'lg');

// ---------------------------------------------------------------- state
let status = null;                 // /api/workshop/status
let catalog = {};                  // use case id → catalog entry
let busy = false;
let step = 0;                      // set on load to where the selected use case should resume
let selected = keep.get('workshop.tab');
/** The Start here tab (New session, same context) is shown in place of the selected use case. */
let startHere = keep.get('workshop.start') !== false;
let shown = null;                  // the stage whose run is shown in detail
// Runs are saved per datapack (and per start of the offline stand-in): they only mean something for the context they ran against.
let context = null;
const runs = {}, audits = {};                             // use case id → {stage: run}, {stage: follow-up}
/**
 * The learning use case's pair exercise: solo (the default), or one of two partners, each with their own Meko account,
 * sharing one datapack. The EU desk solves case 1 and shares its datapack; the APAC desk runs its baseline in its
 * own datapack, switches to the shared one, and runs again. A partner's runs are kept per role, not per datapack, so
 * the baseline stays on the page across the switch.
 */
let pair = Object.assign({mode: 'solo', role: 'apac', shared: false}, keep.get('workshop.pair') || {});
if (pair.role === 'support') pair.role = 'apac';   // saved before the desks were named
let soloLearn = null;   // the solo runs of the learning use case, set aside while pair mode is on
let lesson = null;      // the newest lesson in the datapack in use, as /api/workshop/lesson reports it (pair, support)
const pairRuns = () => keep.get('workshop.pairruns.' + pair.role) || {};

/**
 * Where progress is kept: with a Meko key, in the participant's progress datapack (read back from the workshop
 * datapack's record there, so any browser, a restart or cleared storage shows the same runs); without one, the offline
 * stand-in, in this browser. The pair exercise stays in the browser: its runs span two people's datapacks.
 */
const remote = () => !!(status && status.store.keyed && status.store.live && status.store.connected);
/** Progress read back from Meko, by workshop datapack: kept here, updated as runs are recorded. */
const progressCache = {};
/** Workshop datapacks whose progress is being read: asked once at a time. */
const reading = new Set();
/** The run the server still has for this page: running, or finished with its result not recorded yet. */
let pendingJob = null;
async function progressOf(id) {
  if (progressCache[id]) return progressCache[id];
  try {
    const r = await (await fetch('/api/workshop/progress?context=' + encodeURIComponent(id))).json();
    if (r.available === false) return {runs: {}, audits: {}};
    pendingJob = r.job || null;
    return progressCache[id] = {runs: r.runs || {}, audits: r.audits || {}};
  } catch (e) {
    say('Could not read the progress back from Meko: ' + e.message);
    return {runs: {}, audits: {}};
  }
}

async function loadRuns(id) {
  context = id || 'unsaved-' + Date.now();   // no datapack to file runs under: nothing is kept
  [runs, audits].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  if (remote() && id) {
    const p = await progressOf(id);
    if (context !== id) return;   // another datapack was chosen meanwhile
    Object.entries(p.runs).forEach(([u, st]) => runs[u] = Object.assign({}, st));
    Object.entries(p.audits).forEach(([u, st]) => audits[u] = Object.assign({}, st));
  } else {
    Object.assign(runs, keep.get('workshop.runs9.' + context) || {});
    Object.assign(audits, keep.get('workshop.audits9.' + context) || {});
  }
  soloLearn = runs['organization-learned'] || null;
  if (pair.mode === 'pair') runs['organization-learned'] = pairRuns();
}
function save() {
  const mine = Object.assign({}, runs);
  if (pair.mode === 'pair') {
    keep.set('workshop.pairruns.' + pair.role, runs['organization-learned'] || {});
    if (soloLearn) mine['organization-learned'] = soloLearn; else delete mine['organization-learned'];
  }
  // With Meko, the runs are in the progress datapack; the browser keeps them only for the stand-in (and pair mode).
  if (!remote()) { keep.set('workshop.runs9.' + context, mine); keep.set('workshop.audits9.' + context, audits); }
  keep.set('workshop.tab', selected); keep.set('workshop.pair', pair);
  keep.set('workshop.layout', layout); keep.set('workshop.dpmap', dpMap); keep.set('workshop.dpstem', dpStem);
}

/**
 * A use case's runs wherever they are kept: the pair role's for the learning use case in pair mode, and per use case,
 * those kept under that use case's own datapack (not the one in use).
 */
function runsOf(id) {
  if (id === LEARNS && pair.mode === 'pair') return id === selected ? (runs[id] || {}) : pairRuns();
  const m = perCase() && dpMap[id];
  if (m && m.id !== status.store.datapackId) {
    if (!remote()) return (keep.get('workshop.runs9.' + m.id) || {})[id] || {};
    // Another use case's own datapack: its progress, read once from Meko, then the tabs again.
    if (!progressCache[m.id]) {
      if (!reading.has(m.id)) { reading.add(m.id); progressOf(m.id).then(() => { reading.delete(m.id); renderTabs(); }); }
      return {};
    }
    return progressCache[m.id].runs[id] || {};
  }
  return runs[id] || {};
}

/** Switches the learning use case between solo and a pair role; each keeps its own runs. */
/** Pair mode starts over: this role's runs and the shared flag go (a new datapack, or Start over). */
function resetPair() {
  keep.set('workshop.pairruns.' + pair.role, {});
  pair.shared = false;
  if (pair.mode === 'pair') runs[LEARNS] = {};
}

function setPair(mode, role) {
  if (busy) return;
  if (pair.mode === 'pair') keep.set('workshop.pairruns.' + pair.role, runs['organization-learned'] || {});
  else soloLearn = runs['organization-learned'] || null;
  pair = Object.assign({}, pair, {mode, role: role || pair.role});
  runs['organization-learned'] = mode === 'pair' ? pairRuns() : (soloLearn || {});
  lesson = null; lastMessage = '';
  resume(); save(); render();
  if (mode === 'pair' && pair.role === 'apac') refreshLesson().then(render);
}

/** The newest lesson promoted in the datapack in use (the partner's case 1), or null. */
async function refreshLesson() {
  try { const l = await (await fetch('/api/workshop/lesson')).json(); lesson = l && l.epoch ? l : null; } catch (e) { lesson = null; }
  return lesson;
}

const STAGES = ['Without context', 'Shared knowledge', 'Another desk\'s reviews', 'Collective memory & audit'];
const STAGE_NOTES = ['Empty datapack: only what the agents write during the run', 'Documents uploaded', 'Last quarter\'s reviews, in memory', 'Lessons promoted; records audited'];
/** How the state of the earlier reviews reads on the page ("seeded" is the server's word for it). */
/** A document is in the datapack once it is searchable: uploaded, or its one-line version promoted (not while indexing). */
const docIn = v => v === 'uploaded' || v === 'one-line version';
const reviewsState = v => v === 'seeded' ? 'added' : v === 'missing' || !v ? 'not added yet' : String(v).replace('partly seeded', 'partly added');
const STEPS = [
  // Done once a datapack is connected; on the offline stand-in (no key) there is nothing to create.
  {t: 'Create your datapack', icon: 'database', done: () => status && !choosing && ((status.store.live && status.store.connected && mineInUse()) || !status.store.keyed)},
  {t: 'Run without context', icon: 'play', stage: 0},
  // Per use case: what this use case reads, not everything the workshop's use cases read together.
  {t: 'Add the documents', icon: 'upload', done: () => status && myDocs().length > 0 && myDocs().every(k => docIn(status.documents[k]))},
  {t: 'Run with shared knowledge', icon: 'play', stage: 1},
  {t: 'Add last quarter\'s reviews', icon: 'history', done: () => status && status.history[selected] === 'seeded'},
  {t: 'Run with their reviews', icon: 'play', stage: 2},
  {t: 'Promote & audit', icon: 'shield', stage: 3},
  // The pair exercise's own steps (the learning use case, in pair mode).
  {t: 'Share it with your partner', icon: 'user', done: () => !!pair.shared},
  {t: 'Switch to the shared datapack', icon: 'database', done: () => switchedToShared()}];
/** The last step of the usual flow: named for what it does in each use case. */
const FINALE = 6;
/** The support partner has moved from the datapack its baseline ran in to another one (the shared one). */
function switchedToShared() {
  const base = (runs['organization-learned'] || {})[0];
  return !!(base && base.datapackId && status.store.connected && status.store.datapackId && status.store.datapackId !== base.datapackId);
}
/**
 * The learning use case runs the same case twice around another desk's case: the APAC desk's investigator alone (nothing promoted
 * yet), the EU payments desk's agent on case 1 (it promotes the root cause), then the APAC desk's again.
 */
const LEARNS = 'organization-learned';
// Pair mode needs two Meko accounts: without a key (the stand-in), the use case runs solo whatever was saved.
const pairOn = (id = selected) => id === LEARNS && pair.mode === 'pair' && !!(status && status.store.keyed);
/** Whether the learning use case's lesson is in the datapack: for the APAC partner, as the datapack reports it. */
const learnPromoted = () => selected === LEARNS && (pairOn() && pair.role === 'apac' ? !!lesson : !!(runs[LEARNS] && runs[LEARNS][2]));
/** Each partner's steps, in the order they do them. */
const pairSteps = () => pair.role === 'eu' ? [0, 5, 7] : [0, 1, 8, 6];
const PAIR_TITLES = {eu: {0: 'Create your datapack', 5: 'Solve case 1', 7: 'Share it with your partner'},
  apac: {0: 'Create your own datapack', 1: 'Run without the lesson', 8: 'Switch to the shared datapack', 6: 'Run with the lesson'}};
const LEARN_STAGES = {0: ['Without the lesson', 'Your investigator, case 2: nothing promoted yet'],
  2: ['The EU desk\'s case 1', 'The EU payments desk\'s agent solves it and promotes the root cause'],
  3: ['With the lesson', 'Your investigator, case 2 again: the root cause is collective memory']};
const LEARN_STEPS = {1: 'Run without the lesson', 5: 'The EU desk solves case 1', 6: 'Run with the lesson'};
/**
 * A use case that reads both documents and another desk's earlier reviews (the KYC review) gets them in one stage: the
 * standard alone changes nothing without an earlier review to compare with, so its own run would only repeat the
 * first. Its steps: add last quarter's reviews, add the documents, then one run with both.
 */
const memoryFirst = (id = selected) => { const u = status.useCases.find(x => x.id === id); return !!u && u.history && u.documents.length > 0; };
const BOTH_STAGE = ['The standard & last quarter\'s reviews', 'The standard added, and another desk\'s reviews in memory'];
const stageName = (s, id = selected) => id === LEARNS && LEARN_STAGES[s] ? LEARN_STAGES[s][0] : s === 2 && memoryFirst(id) ? BOTH_STAGE[0] : STAGES[s];
const stageNote = (s, id = selected) => id === LEARNS && LEARN_STAGES[s] ? LEARN_STAGES[s][1] : s === 2 && memoryFirst(id) ? BOTH_STAGE[1] : STAGE_NOTES[s];
/** The documents the selected use case reads. */
const myDocs = () => (status.useCases.find(x => x.id === selected) || {documents: []}).documents;
const TAB_ICONS = {'dont-make-me-explain': 'card', 'loan-underwriting': 'bank', 'what-changed': 'id', 'organization-learned': 'bulb'};
/** Whether a step is done; while a new datapack is being chosen (Start over), none after step 1 is: they were the old one's. */
const stepDone = i => choosing && STEPS[i].t !== 'Create your datapack' ? false
  : STEPS[i].stage != null ? !!(runs[selected] && runs[selected][STEPS[i].stage]) : STEPS[i].done();

/**
 * Which steps a use case needs: the documents only if it reads them, the history only if it reads it. The learning use
 * case needs nothing in the datapack (its lesson is written and promoted during the run), so it runs at its last step.
 */
function needed(i, id = selected) {
  const u = status.useCases.find(x => x.id === id);
  if (pairOn(id)) return pairSteps().includes(i);
  if (i >= 7) return false;
  if (i === 0 || i === 6) return true;
  if (id === LEARNS) return i === 1 || i === 5;
  if (i === 3 && memoryFirst(id)) return false;
  if (i === 1) return true;
  if (i === 2 || i === 3) return u.documents.length > 0;
  return u.history;
}
/** The use cases where one agent hands the case to another: memory written during the run is what crosses. */
const handsOff = id => id === 'dont-make-me-explain' || id === 'loan-underwriting';
const stageNeeded = (s, id = selected) => needed(STEPS.findIndex(x => x.stage === s), id);
function whyNotNeeded(i) {
  const t = catalog[selected].title;
  if (selected === LEARNS) return t + ' needs nothing added to your datapack: the EU desk\'s agent promotes the lesson during its run.';
  if (i === 2 || i === 3) return t + ' reads no shared knowledge: nothing to add for it.';
  return t + ' does not read another desk\'s earlier reviews: nothing to add for it.';
}
const promotes = id => id === 'organization-learned' || id === 'loan-underwriting';

/** Where the selected use case resumes: the first step it needs that is not done yet (the last step once all are). */
/** Opening a use case (its tab, or the page): one not run yet opens at its step 1, its datapack; one already started resumes. */
function openUseCase() {
  if (Object.keys(runs[selected] || {}).length > 0) resume();
  else { step = mySteps()[0]; shown = null; }
}

function resume() {
  const open = mySteps().find(i => !stepDone(i));
  step = open == null ? mySteps().slice(-1)[0] : open;
  shown = null;
}

// ---------------------------------------------------------------- use case tabs and description
/** The Start here tab's key: New Session, Same Context. */
const START = 'start-here';
function renderTabs() {
  // The vertical before the first use case of each (BFSI), then each tab names only its area (PAYMENTS, KYC).
  const vertical = id => String(catalog[id].domain).split(' / ')[0];
  const area = id => String(catalog[id].domain).split(' / ').slice(1).join(' / ') || catalog[id].domain;
  // New Session, Same Context first: the simplest case of context lost between sessions, before the three BFSI use cases.
  // Its vertical (SDLC) beside it, as the BFSI use cases have theirs.
  const groups = [{label: 'SDLC', tabs: [{key: START, icon: icon('play', 'lg'), kicker: 'AI assistants', title: 'New Session, Same Context', selected: startHere}]}];
  status.useCases.forEach(u => {
    const stages = [0, 1, 2, 3].filter(s => stageNeeded(s, u.id));
    const tab = {key: u.id, icon: icon(TAB_ICONS[u.id] || 'dot', 'lg'), kicker: area(u.id), title: catalog[u.id].title,
      selected: u.id === selected && !startHere, busy: busy && running && running.useCase === u.id,
      meta: WK.dots(stages.map(s => !!runsOf(u.id)[s]), stages.filter(s => runsOf(u.id)[s]).length + ' of ' + stages.length + ' stages run')};
    const last = groups[groups.length - 1];
    if (last.label === vertical(u.id)) last.tabs.push(tab); else groups.push({label: vertical(u.id), tabs: [tab]});
  });
  WK.tabBar(el('tabs'), groups, async key => {
    // Switching use cases can switch datapacks: not while something runs (the steps stay browsable meanwhile).
    if (busy) { say('Wait for the run to finish before switching use cases: it may use another datapack.'); return; }
    lastMessage = '';
    if (key === START) {
      startHere = true; keep.set('workshop.start', true);
      await useCaseDatapack(SESSIONS);   // per use case: New Session's own datapack
      render(); tellSessions();
      return;
    }
    // Another use case: it resumes at its own first open step, and the last message (about the other one) is cleared.
    selected = key; suggested = null; startHere = false; keep.set('workshop.start', false);
    await useCaseDatapack();   // per use case: the tab's own datapack
    openUseCase();
    save(); render();
  });
}

// ---------------------------------------------------------------- the guided steps
/** The steps the selected use case has, in order (indexes into STEPS). */
const mySteps = () => (pairOn() ? pairSteps() : memoryFirst() ? [0, 1, 4, 2, 5, 6] : STEPS.map((x, i) => i)).filter(i => needed(i));
/** A step's number as this use case counts them. */
const stepNo = i => mySteps().indexOf(i) + 1;
/** A step's title; the last one is named for what it does in this use case. */
function stepTitle(i) {
  if (pairOn() && PAIR_TITLES[pair.role][i]) return PAIR_TITLES[pair.role][i];
  if (selected === LEARNS && LEARN_STEPS[i]) return LEARN_STEPS[i];
  if (i === 5 && memoryFirst()) return 'Run with the standard and their reviews';
  if (i !== FINALE) return STEPS[i].t;
  const f = finale();
  return f.rerun && f.audit ? 'Promote & audit' : f.audit ? 'Audit' : 'Promote & reuse';
}

function renderStepper() {
  const runningHere = busy && running && running.useCase === selected ? running.step : -1;
  WK.stepList(el('stepper'), mySteps().map(i => {
    const done = stepDone(i), wait = done ? null : earlierOpen(i);
    return {key: i, title: stepTitle(i), done, current: i === step, locked: !!wait, running: i === runningHere,
      sub: i === runningHere ? 'Running…' : done ? 'Done' : wait || (STEPS[i].stage != null ? stageNote(STEPS[i].stage) : 'To do'), tip: wait || stepTitle(i)};
  }), k => {
    // Another step, also while something runs (look around; the running pill comes back to it). A step whose earlier
    // steps are open is shown in the list, not entered: it says which step comes first.
    const i = Number(k), wait = stepDone(i) ? null : earlierOpen(i);
    if (wait) { say(wait); return; }
    step = i; shown = STEPS[step].stage ?? shown; lastMessage = ''; save(); render();
  });
}

/** Back, Next and where this step stands: Next lights up once the step is done. */
function renderNav() {
  const mine = mySteps(), at = mine.indexOf(step), next = mine[at + 1];
  el('eyebrow').textContent = 'Step ' + (at + 1) + ' of ' + mine.length + ' · ' + stepTitle(step);
  el('prev').disabled = at <= 0;

  el('next').textContent = next == null ? 'Last step' : 'Next: ' + stepTitle(next) + ' →';
  el('nextWhy').textContent = next == null || canNext ? '' : 'Finish this step first.';

  el('startOver').disabled = busy;

  const away = busy && running && !(running.useCase === selected && running.step === step && !startHere);
  el('running').hidden = !away;
