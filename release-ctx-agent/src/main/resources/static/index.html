      ${decision.evidenceHash ? `<span class="small muted">Evidence artifact <code>${esc(decision.evidenceHash.slice(0, 16))}…</code> on the record of ${esc(decision.prId)}.</span>` : ''}</div>`;
  if (run.error) html += `<div class="decision failed"><b>The run failed</b><div>${esc(run.error)}</div></div>`;
  html += planHtml(by);
  html += '<div class="grid2">';
  html += `<div class="sub-box"><h3>What the agent knew</h3>${ctx ? `
      <b class="small">Shared knowledge</b><ul class="plain">${Object.keys(ctx.rules).length ? Object.values(ctx.rules).map(r => `<li><b>${esc(r.id)}</b> ${esc(r.text.slice(r.id.length, 140))}…</li>`).join('') : '<li class="muted">No standard, no policy.</li>'}</ul>
      <b class="small">Memory</b><ul class="plain">${ctx.incidents.map(i => `<li>${esc(i.text)} <span class="who">— ${esc(i.writtenBy)} · ${esc(i.datapack)}</span></li>`).join('')}
        ${ctx.queries.map(q => `<li>Critical: <b>${esc(q.name)}</b> <code>${esc(q.sql)}</code> <span class="who">— ${esc(q.writtenBy)} · ${esc(q.datapack)}</span></li>`).join('')}
        ${!ctx.incidents.length && !ctx.queries.length ? '<li class="muted">No incident and no critical query on orders.</li>' : ''}</ul>
      ${ctx.setAside.length ? `<b class="small">Set aside</b><ul class="plain">${ctx.setAside.map(a => `<li><span class="aside">${esc(a.text.slice(0, 110))}…</span> <span class="muted">${esc(a.reason)}</span> <span class="who">— ${esc(a.writtenBy)} · ${esc(a.datapack)}</span></li>`).join('')}</ul>` : ''}` : '<span class="muted">…</span>'}</div>`;
  html += `<div class="sub-box"><h3>Review against the standard</h3><p class="small muted">${esc(review?.text || '…')}</p>
      <p class="small" style="margin-top:6px">Each finding, the statement it is about and what it was rewritten to: <b>Run by run</b>, above.</p></div>`;
  html += '</div>';
  if (steps.length) html += `<h3>On the rehearsal branch</h3><div class="tablewrap"><table><tr><th>Step</th><th>Statement</th><th class="num">Took</th><th>Evidence</th><th class="num">Checkout's worst insert</th><th class="num">WAL</th></tr>
    ${steps.map(s => `<tr><td>${s.rollback ? 'rollback ' : ''}${esc(s.script.replace('.sql', ''))} #${s.number}</td><td class="sql">${esc(s.text)}</td><td class="num">${ms(s.millis)}</td>
      <td>${s.ok ? '' : '<span class="tag bad">failed</span>'}${s.rewrote ? '<span class="tag bad">rewrote the table</span>' : ''}${s.migrationWaitedOnLock ? '<span class="tag warn">waited for its lock</span>' : ''}${s.checkoutWaitedOnLock ? '<span class="tag warn">checkout queued</span>' : ''}${s.attempts > 1 ? `<span class="tag warn">${s.attempts} attempts</span>` : ''}${s.error && !s.ok ? `<div class="small muted">${esc(s.error)}</div>` : ''}</td>
      <td class="num">${s.worstCheckoutMillis > stall ? `<span class="tag bad">${ms(s.worstCheckoutMillis)}</span>` : ms(s.worstCheckoutMillis)}</td><td class="num">${bytes(s.walBytes)}</td></tr>`).join('')}</table></div>`;
  if (planCheck) html += `<h3>Critical queries</h3><p class="small muted">${esc(planCheck.text)}</p>${(planCheck.data || []).length ? `<div class="tablewrap"><table><tr><th>Query</th><th>Before</th><th>After</th><th class="num">Buffers</th><th>With the dropped index put back</th></tr>
    ${planCheck.data.map(c => `<tr><td>${esc(c.before.name)}</td><td>${esc(c.before.node)} ${c.before.index ? 'on <code>' + esc(c.before.index) + '</code>' : ''}</td><td>${esc(c.after.node)} ${c.after.index ? 'on <code>' + esc(c.after.index) + '</code>' : ''}</td>
      <td class="num">${c.before.buffers} → ${c.regressed ? `<span class="tag bad">${c.after.buffers}</span>` : c.after.buffers}</td>
      <td>${c.kept ? `<span class="tag ${c.keptFixes ? 'ok' : 'bad'}">${c.kept.buffers} buffers</span> ${esc(c.kept.node)}${c.keptFixes ? ': keeping it fixes the query' : ': not enough'}` : '<span class="muted">—</span>'}</td></tr>`).join('')}</table></div>` : ''}`;
  if (rollback) html += `<h3>Rollback</h3><p class="small muted">${esc(rollback.text)}</p>`;
  return html;
}

/**
 * Promotion: a lesson an agent wrote to its own memory moves into the datapack's shared knowledge base, where every agent
 * and person working in the datapack finds it by search, as they find the runbook. One way; only the owner can promote.
 */
function promoteItem(m) {
  const lessons = state.lessons;
  if (lessons == null && m.s.lessons) load('lessons', '/lessons');
  const list = lessons || [];
  return `<li class="${m.s.lessons ? '' : 'wait'}"><div><div class="h">Promote what the runs taught</div>
    <div class="d">While running, the agents write lessons to <b>their own memory</b>: other agents do not search it. Promoting moves a lesson
      into the datapack's <b>shared knowledge base</b>, so every agent and person working in it finds the lesson by search, as they find the
      standard or the runbook. It is one way, and only the datapack's owner can promote.</div>
    ${list.length ? `<ul class="plain" style="margin-top:10px">${list.map(l => `<li>${esc(l.text)} <span class="who">— memory of this run's agent</span></li>`).join('')}</ul>`
      : `<p class="hint">${m.s.lessons ? 'Loading the lessons…' : 'No lesson waiting: a run that learns something writes one (and promoted lessons leave this list).'}</p>`}
    <div class="row act-row"><button class="btn act" id="promote" ${m.s.lessons ? '' : 'disabled'}>Promote ${m.s.lessons || ''} lesson${m.s.lessons === 1 ? '' : 's'} to shared knowledge</button></div></div></li>`;
}

/** Shows a record read back from Meko under the button that read it, in the audit step. */
function renderAudit(a) {
  state.audit = {record: USE_CASES[state.useCase].record, data: a};
  render();
  requestAnimationFrame(() => $('auditInline')?.scrollIntoView({behavior: 'smooth', block: 'start'}));
}

function auditBlock() {
  const a = state.audit;
  if (!a || a.record !== USE_CASES[state.useCase].record) return '';
  const d = a.data;
  return `<div class="audit-inline" id="auditInline"><h3>The record of ${esc(a.record)}, read back by its id</h3>
    ${!d.turns.length ? '<p class="hint">Nothing recorded yet: the record fills as runs go (a turn takes a few seconds to become readable).</p>'
    : `<div class="tablewrap"><table><tr><th>Run</th><th>Event</th><th>What was done</th><th>What came of it</th><th>Written by</th></tr>
    ${d.turns.map(t => `<tr><td>${esc(t.run)}</td><td>${esc(t.event)}</td><td>${esc(t.input)}</td><td>${esc(t.output)}</td><td class="who">${esc(t.writer)}</td></tr>`).join('')}</table></div>`}
    ${d.evidence ? `<h3>Evidence artifact <code>${esc(d.evidenceHash.slice(0, 16))}…</code></h3><div class="log">${esc(JSON.stringify(d.evidence, null, 2))}</div>` : ''}</div>`;
}

/* ------------------------------------------------------------------ refresh */
async function refresh() {
  try { state.status = await api('/status'); } catch (e) { say(e.message); }
  const s = state.status || {};
  // Clusters live in a datapack: another datapack, another list.
  const datapackId = s.meko?.connected ? s.meko.datapackId : null;
  if (datapackId !== state.listedFor) { state.listedFor = datapackId; state.clusters = null; state.clChoice = null; state.orgDatapacks = null; }
  // A job started before this page loaded (or before a reload): follow it.
  if (s.job?.status === 'running' && !polling) follow(s.job.id, s.job.type, jobStep(s.job.type), localRuns().find(r => r.id === s.job.id)?.label);
  if (s.progressError) say(s.progressError);
  // The server is still reading this datapack's record back: look again shortly, not in 20 s.
  if (s.progress?.loading) setTimeout(() => { if (!polling) refresh(); }, 2000);
  render();
  renderRuns();
}
refresh();
setInterval(() => { if (!polling) refresh(); }, 20000);
</script>
</body>
</html>
